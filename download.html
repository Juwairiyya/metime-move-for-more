<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e83e79">
<title>Download Your Poster | MOVE FOR MORE</title>

<style>
:root {
  --pink: #e83e79;
  --light: #fff4f8;
  --dark: #29252b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: var(--light);
  color: var(--dark);
  font-family: Arial, sans-serif;
}

main {
  max-width: 700px;
  margin: auto;
  text-align: center;
}

h1 {
  color: #c52c65;
  font-size: 27px;
}

.card {
  background: white;
  border: 1px solid #f2c6d6;
  border-radius: 18px;
  padding: 18px;
  margin-top: 20px;
}

p {
  line-height: 1.6;
}

#poster {
  display: block;
  width: 100%;
  max-width: 540px;
  height: auto;
  margin: 20px auto;
  border: 1px solid #f2c6d6;
  border-radius: 8px;
}

button {
  display: block;
  width: 100%;
  max-width: 540px;
  min-height: 52px;
  padding: 14px;
  margin: 12px auto;
  border: none;
  border-radius: 10px;
  background: var(--pink);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  background: var(--dark);
}

.note {
  font-size: 14px;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>
<main>
  <h1>💗 Your MOVE FOR MORE Poster</h1>

  <section class="card">
    <p id="message" aria-live="polite">
      Preparing your personalised poster...
    </p>

    <img
      id="poster"
      alt="Your personalised MOVE FOR MORE attendance poster"
      hidden
    >

    <button id="savePhoto" hidden>
      SAVE POSTER TO PHOTOS
    </button>

    <button id="download" hidden class="secondary">
      DOWNLOAD POSTER PNG
    </button>

    <button id="back" class="secondary">
      BACK TO CREATE POSTER
    </button>

    <p class="note">
      After tapping Save Poster to Photos, look for
      Save Image or Save to Photos in your iPhone sharing menu.
    </p>

    <p class="note">
      Your photograph is processed in your browser and is
      not uploaded to this website.
    </p>
  </section>
</main>

<script>
const imageData = sessionStorage.getItem("metimePosterData");
const participantName =
  sessionStorage.getItem("metimePosterName") || "Participant";

const poster = document.getElementById("poster");
const message = document.getElementById("message");
const savePhotoButton = document.getElementById("savePhoto");
const downloadButton = document.getElementById("download");

let posterBlob = null;

function safeFileName() {
  const cleanName = participantName
    .replace(/[^a-z0-9]+/gi, "-")
    .replace(/^-|-$/g, "");

  return "Metime-Move-for-More-" +
    (cleanName || "Participant") + ".png";
}

async function preparePoster() {
  if (!imageData) {
    message.textContent =
      "Your poster was not found. Return to the creation page, " +
      "enter your details and create your poster first.";
    return;
  }

  try {
    const response = await fetch(imageData);
    posterBlob = await response.blob();

    poster.src = URL.createObjectURL(posterBlob);
    poster.hidden = false;

    savePhotoButton.hidden = false;
    downloadButton.hidden = false;

    message.textContent =
      "Well done, " + participantName +
      "! Your poster is ready. Choose how you want to save it.";
  } catch (error) {
    message.textContent =
      "We couldn't prepare your poster. Please return and create it again.";
  }
}

savePhotoButton.addEventListener("click", async function() {
  if (!posterBlob) {
    alert("Your poster is not ready yet. Please wait a moment.");
    return;
  }

  const file = new File(
    [posterBlob],
    safeFileName(),
    { type: "image/png" }
  );

  try {
    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {
      await navigator.share({
        files: [file],
        title: "My MOVE FOR MORE Poster"
      });

      message.textContent =
        "If you selected Save Image or Save to Photos, " +
        "check your iPhone Photos app.";
    } else {
      downloadPoster();
      message.textContent =
        "Your poster was downloaded. Open it and use the Share " +
        "menu to save it to Photos.";
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      alert(
        "The sharing menu could not open. " +
        "Please tap Download Poster PNG instead."
      );
    }
  }
});

function downloadPoster() {
  if (!posterBlob) {
    alert("Your poster is not ready yet. Please wait a moment.");
    return;
  }

  const url = URL.createObjectURL(posterBlob);
  const link = document.createElement("a");

  link.href = url;
  link.download = safeFileName();

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 60000);
}

downloadButton.addEventListener("click", downloadPoster);

document.getElementById("back").addEventListener("click", function() {
  window.location.href = "index.html";
});

preparePoster();
</script>
</body>
</html>
